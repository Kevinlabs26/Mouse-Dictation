name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mouse Dictation ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            - Updated the application icon.
            - Added multilingual system tray menus.
            - Minimize the window to the system tray without showing it in the taskbar.
            - Added automatic update checking with signed Windows installers.
            - Replaced the native update prompt with an in-app dialog matching the application theme.

            ## Downloads

            - NSIS installer: recommended for most users
            - MSI installer: Windows installer package
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
