name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          args: --config src-tauri/tauri.release.conf.json
          releaseName: Mouse Dictation ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            - Fixed recording freezing at 00:00 after the microphone overlay appeared.
            - Fixed the overlay remaining visible after releasing the mouse button.

            ## Downloads

            - NSIS installer: recommended for most users
            - MSI installer: Windows installer package
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
