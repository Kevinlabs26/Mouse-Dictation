name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mouse Dictation ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            - Improved multilingual API transcription across supported providers and models.
            - The selected transcription language is now respected without forcing a fixed language.
            - Automatic language detection remains available for mixed-language use.
            - Added language-matched punctuation guidance for Chinese, French, German, Spanish, Japanese, Korean, and English.
            - Added a manual “Check for updates” option to the system tray menu.
            - Added the current version and a manual update button to the app footer.
            - Added a multilingual first-run guide with a GitHub Star page.
            - Added a Telegram community link beside the GitHub Star option and in the footer.

            ## Downloads

            - NSIS installer: recommended for most users
            - MSI installer: Windows installer package
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
