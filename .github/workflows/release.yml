name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: npm ci
      - name: Test frontend security regressions
        run: npm test
      - name: Prepare frontend and verified native libraries
        run: npm run build:desktop
      - name: Test portable archive packaging
        run: node --test tests/portable.test.mjs
      - name: Test Rust security regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target-dir src-tauri/target
      - name: Build installers and updater signatures in draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          args: --config src-tauri/tauri.release.conf.json
          releaseName: Mouse Dictation ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            - Added quiet GitHub and feedback links in the app footer.
            - Added an installation-free Windows ZIP with verified native libraries.
            - Added language-aware dictionary rules, a local preview, and opt-in in-memory recent results.
            - Bound API credentials to their endpoint and profile, with atomic configuration writes and failure-safe migration.
            - Improved recording cancellation, Windows input safeguards, and text size limits.
            - Updated dependency security patches and replaced legacy ZIP build dependencies while preserving the recognition library ABI.
            - Included a concise Windows security audit with detailed dependency and patch evidence.
            - Added frontend, Rust, portable-package, and native-library checks before publishing.

            ## Compatibility

            - Existing credentials migrate to endpoint/profile-bound system credential records. Older app versions may require keys to be entered again after migration.
            - Legacy Tauri 1 ZIP updater packages are no longer supported. Current EXE/MSI updates remain supported.
            - Remote APIs require HTTPS; localhost and literal loopback HTTP remain supported.
            - Runtime verification covers Windows x64. Linux/macOS validation and upstream maintenance warnings remain documented in the audit.

            ## Downloads

            - NSIS installer: recommended for most users.
            - MSI installer: Windows installer package.
            - Portable ZIP: extract the full folder and run mouse-dictation.exe; WebView2 Runtime is required.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
      - name: Package portable app and stable installer alias
        shell: pwsh
        run: |
          node scripts/package-portable.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseVersion = node -p "require('./package.json').version"
          $installerSource = Join-Path 'src-tauri/target/release/bundle/nsis' ("Mouse Dictation_{0}_x64-setup.exe" -f $releaseVersion)
          Copy-Item -LiteralPath $installerSource -Destination 'src-tauri/target/release/bundle/portable/Mouse-Dictation-windows-x64-setup.exe' -ErrorAction Stop
      - name: Upload portable app and stable installer alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" "src-tauri/target/release/bundle/portable/Mouse-Dictation-windows-x64-portable.zip" "src-tauri/target/release/bundle/portable/Mouse-Dictation-windows-x64-setup.exe"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
