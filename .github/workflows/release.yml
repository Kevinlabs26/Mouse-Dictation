name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          args: --config src-tauri/tauri.release.conf.json
          releaseName: Mouse Dictation ${{ github.ref_name }}
          releaseBody: |
            ## What's new

            - Added automatic update checks every six hours while the app is running.
            - Reworked recording shortcut settings into a compact, customizable layout with reset support.
            - Added single-key F1–F12 recording shortcuts, with F12 as the default.
            - Improved Japanese and other localized interface labels.
            - Added Buy Me a Coffee to the app and GitHub funding links.
            - Simplified the post-update notice by removing redundant update-content text.

            ## Downloads

            - NSIS installer: recommended for most users
            - MSI installer: Windows installer package
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
