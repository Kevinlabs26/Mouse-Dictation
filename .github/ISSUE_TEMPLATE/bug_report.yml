name: Bug report / 问题反馈
description: Report a problem with Mouse Dictation / 反馈使用问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please do not include API keys, private recordings, or personal text.
        请勿附上 API Key、私人录音或包含个人信息的文本。
  - type: input
    id: version
    attributes:
      label: App version / 软件版本
      placeholder: "Shown at the bottom of the app / 软件底部显示的版本"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: "Windows 11 / Windows 10"
  - type: textarea
    id: steps
    attributes:
      label: What happened? / 遇到了什么问题？
      description: Include steps, recognition mode and the result you expected. / 请写出操作步骤、识别模式和预期结果。
    validations:
      required: true
